name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Build Linux binaries
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o syspect ./cmd/syspect
            tar -czf "syspect-linux-${arch}.tar.gz" syspect
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            syspect-linux-amd64.tar.gz
            syspect-linux-arm64.tar.gz
